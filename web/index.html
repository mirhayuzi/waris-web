<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waris Web – Lihat salasilah keluarga</title>
<meta name="description" content="Buka fail keluarga Waris di iPhone atau komputer dan lihat salasilah, cari nama dan semak hubungan. Fail dibuka dalam peranti anda sahaja.">
<meta name="theme-color" content="#2E3F8F">
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Waris">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--indigo:#2E3F8F;--kunyit:#D49A00;--bg:#E6E9F3;--surface:#fff;--text:#1A1D2E;--muted:#5E6278;--border:#D5D9E6;--male:#2B7FD4;--female:#E0517F;--maleSoft:#BDE6F5;--femaleSoft:#F8D2DE}
@media (prefers-color-scheme:dark){:root{--bg:#141729;--surface:#1F2338;--text:#ECEEF7;--muted:#A6ABC4;--border:#33385A}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--indigo);color:#fff}
.top img{width:32px;height:32px;border-radius:8px}
.top .t{flex:1;min-width:0}
.top .t b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t span{font-size:12px;opacity:.85}
.chip{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-weight:700}
#start{max-width:560px;margin:0 auto;padding:40px 20px;text-align:center}
#start img{width:96px;height:96px;border-radius:22px}
#start h1{font-size:28px;margin:16px 0 8px}
#start p{color:var(--muted);line-height:1.6}
.primary{display:block;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--indigo);color:#fff;font-size:16px;font-weight:700;margin-top:16px}
.secondary{display:block;width:100%;min-height:48px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--indigo);font-size:15px;font-weight:700;margin-top:10px}
.lock{display:flex;gap:8px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:20px;font-size:14px;color:var(--muted)}
#error{color:#B3261E;font-weight:600}
#app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);position:relative}
#search{flex:1;min-height:42px;border:1px solid var(--border);border-radius:12px;padding:0 12px;font:inherit;font-size:16px;background:var(--bg);color:var(--text)}
#results{position:absolute;left:12px;right:12px;top:56px;background:var(--surface);border:1px solid var(--border);border-radius:12px;max-height:50vh;overflow:auto;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.result{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);background:none;color:var(--text);padding:12px;font-size:15px}
.muted{color:var(--muted)}
#picking{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#FFF3D1;color:#5C4300;font-weight:600;font-size:14px}
#picking button{margin-left:auto;border:0;background:none;color:#5C4300;font-weight:700;min-height:36px}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:var(--bg)}
#canvas{position:absolute;left:0;top:0;transform-origin:0 0}
#canvas svg{display:block}
.hit{position:absolute;border:0;background:transparent;border-radius:8px}
.hit:focus-visible{outline:3px solid var(--kunyit)}
.zoom{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.zoom button{width:44px;height:44px;border-radius:22px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:20px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.hintline{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));right:70px;font-size:12px;color:var(--muted)}
#sheet{position:fixed;inset:0;background:rgba(10,12,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.panel{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
@media (min-width:700px){#sheet{align-items:center}.panel{border-radius:20px}}
.panelTop{display:flex;justify-content:flex-end}
.panelTop button{min-height:40px;border:0;background:var(--bg);color:var(--text);border-radius:20px;padding:0 14px;font-weight:700}
.phead{display:flex;gap:14px;align-items:center}
.phead h2{margin:0;font-size:22px}
.phead p{margin:2px 0}
.portrait{width:96px;height:120px;border-radius:14px;flex-shrink:0;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800}
.portrait.male{background-color:var(--maleSoft);color:#0E4D6E;border-bottom:5px solid var(--male)}
.portrait.female{background-color:var(--femaleSoft);color:#9E1F4F;border-bottom:5px solid var(--female)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:16px 0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600}
.notes{white-space:pre-line;line-height:1.5}
h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 6px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;color:var(--text);padding:8px 0;min-height:52px}
.row .rowtext{display:flex;flex-direction:column}
.av{width:40px;height:40px;border-radius:20px;flex-shrink:0;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-weight:800}
.av.male{background-color:var(--maleSoft);color:#0E4D6E}.av.female{background-color:var(--femaleSoft);color:#9E1F4F}
.pair{display:flex;gap:12px}
.paircard{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.paircard .portrait{width:100%;height:180px}
.hero{background:var(--indigo);color:#fff;border-radius:18px;padding:18px;margin-top:14px}
.hero .kicker{color:#F2C14E;font-size:12px;font-weight:700;letter-spacing:.12em}
.hero .big{font-size:22px;font-weight:800;margin-top:6px;line-height:1.3}
.hero .small{opacity:.85;margin-top:6px;font-style:italic}
.meet{background:var(--bg);border-radius:14px;padding:4px 12px 12px}
.boxes{display:flex;gap:10px}
.box{flex:1;background:var(--surface);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.box .kin{color:var(--indigo);font-weight:800;font-size:16px}
@media (prefers-color-scheme:dark){.box .kin{color:#9AA8F0}}
.box .dots{color:var(--indigo);letter-spacing:2px}
.reverse{font-weight:700;margin-top:16px}
</style>
</head>
<body>
<input type="file" id="file" accept=".json,.waris,application/json,text/plain" hidden>

<div id="start">
  <img src="../assets/icon-512.png" alt="Waris">
  <h1>Waris Web</h1>
  <p data-t="intro">Buka fail Waris yang dikongsi dengan anda (dari WhatsApp, Telegram atau Fail) untuk melihat salasilah keluarga.</p>
  <button class="primary openBtn" data-t="open">Buka fail keluarga</button>
  <button class="secondary" id="demoBtn" data-t="demo">Cuba contoh keluarga</button>
  <p id="error" hidden></p>
  <div class="lock"><span aria-hidden="true">🔒</span><span data-t="private">Fail dibuka dalam peranti ini sahaja. Tiada apa-apa dimuat naik.</span></div>
  <p><a href="../">waris.com.my</a> · <button class="chip" id="langBtn" style="color:var(--indigo);border-color:var(--border)">EN</button></p>
</div>

<div id="app" hidden>
  <div class="top">
    <img src="../assets/icon-180.png" alt="">
    <div class="t"><b id="family">Waris</b><span id="count"></span></div>
    <button class="chip openBtn" data-t="other">Buka fail lain</button>
  </div>
  <div class="bar">
    <input id="search" type="search" autocomplete="off" aria-label="Cari">
    <div id="results" hidden></div>
  </div>
  <div id="picking" hidden><span id="pickingText"></span><button id="cancelPick" aria-label="Batal">✕</button></div>
  <div id="stage">
    <div id="canvas"></div>
    <div class="hintline" data-t="hint"></div>
    <div class="zoom">
      <button id="zoomIn" aria-label="Zum masuk">+</button>
      <button id="zoomOut" aria-label="Zum keluar">−</button>
      <button id="fitBtn" aria-label="Muat skrin">⤢</button>
    </div>
  </div>
</div>

<div id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true">
    <div class="panelTop"><button id="closeSheet" data-t="close">Tutup</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<script src="viewer.js"></script>
</body>
</html>
